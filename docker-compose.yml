version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mirror:mirror_dev@db:5432/mirror_ai
      - APP_ENV=development
      - APP_DEBUG=true
      - CORS_ORIGINS=["http://localhost:3000"]
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mirror
      - POSTGRES_PASSWORD=mirror_dev
      - POSTGRES_DB=mirror_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
